[tool.poetry]
name = "knowledgelayer"
version = "0.1.0"
description = "AI-native knowledge graph platform"
authors = ["KnowledgeLayer Team"]
readme = "README.md"
packages = [
    { include = "api" },
    { include = "core" },
    { include = "graph" },
    { include = "models" },
    { include = "pipeline" },
    { include = "vector" },
    { include = "worker" },
    { include = "scripts" },
    { include = "tests" },
]

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
fastapi = ">=0.111.0"
uvicorn = { version = ">=0.30.0", extras = ["standard"] }
pydantic = ">=2.7.0"
pydantic-settings = ">=2.3.0"
neo4j = ">=5.20.0"
asyncpg = ">=0.29.0"
openai = ">=1.30.0"
google-genai = ">=1.0.0"
spacy = ">=3.7.0"
redis = ">=5.0.0"
python-dotenv = ">=1.0.0"
numpy = ">=1.26.0"
httpx = ">=0.27.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.2.0"
pytest-asyncio = ">=0.23.0"
fakeredis = ">=2.23.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
